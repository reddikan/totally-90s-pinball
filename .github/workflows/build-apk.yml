name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Totally90sPinball-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Totally90sPinball-build${{ github.run_number }}
          path: Totally90sPinball-build${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Totally 90's Pinball — build ${{ github.run_number }}
          body: Install the APK below on the Retroid Pocket 5. L1 = left flipper, R2 = right flipper, A = launch.
          files: Totally90sPinball-build${{ github.run_number }}.apk
          make_latest: true
